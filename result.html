<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confession Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #ff4d6d;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow-x: auto; /* Handles small screens */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background-color: #ffeff1;
            color: #ff4d6d;
            padding: 15px;
            text-align: left;
            border-radius: 8px;
            font-weight: 700;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* --- BADGES FOR STATUS --- */
        .badge {
            padding: 5px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .badge-green { background: #d1fae5; color: #065f46; } /* Accepted */
        .badge-red { background: #fee2e2; color: #991b1b; }   /* Rejected */
        .badge-yellow { background: #fef3c7; color: #92400e; } /* Negotiating/Maybe */
        .badge-blue { background: #dbeafe; color: #1e40af; }   /* In Progress */

        /* --- TEXT STYLES --- */
        .timestamp {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }

        .message-box {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid #ff4d6d;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>❤️ Confession Results</h1>

    <div class="container">
        <table id="resultsTable">
            <thead>
                <tr>
                    <th width="15%">Name</th>
                    <th width="15%">Status</th>
                    <th width="20%">Confession Response</th>
                    <th width="20%">Date / Hangout</th>
                    <th width="30%">Final Message / Plan</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
        <div id="loading" class="empty-state">Connecting to satellite... 📡</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDV_suRKZfNkHR5OJABEvDvf-CXSNfbG88",
            authDomain: "confession-4d848.firebaseapp.com",
            databaseURL: "https://confession-4d848-default-rtdb.firebaseio.com",
            projectId: "confession-4d848",
            storageBucket: "confession-4d848.firebasestorage.app",
            messagingSenderId: "839865796935",
            appId: "1:839865796935:web:e6911c8dddf6bd0e12a462"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. FETCH DATA (Real-time listener)
        const resultsRef = db.ref('her_response');

        resultsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('tableBody');
            const loading = document.getElementById('loading');
            
            tbody.innerHTML = ""; // Clear table to avoid duplicates
            loading.style.display = "none";

            if (data) {
                // Firebase returns an Object. We convert it to an Array to sort by time.
                const entries = Object.keys(data).map(key => data[key]);
                
                // Sort: Newest first
                entries.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));

                entries.forEach(user => {
                    const row = document.createElement('tr');
                    
                    // --- 1. NAME ---
                    const nameCell = `
                        <td>
                            <strong>${user.resp_name || 'Anonymous'}</strong>
                            <div class="timestamp">${formatTime(user.last_updated)}</div>
                        </td>`;

                    // --- 2. STATUS (Badge Logic) ---
                    let statusBadge = '';
                    let progress = user.story_progress || 'Started';
                    
                    if(progress.includes('YES') || progress.includes('Accepted')) {
                        statusBadge = `<span class="badge badge-green">${progress}</span>`;
                    } else if (progress.includes('NO') || progress.includes('Rejected')) {
                        statusBadge = `<span class="badge badge-red">${progress}</span>`;
                    } else if (progress.includes('MAYBE') || progress.includes('Negotiate')) {
                        statusBadge = `<span class="badge badge-yellow">${progress}</span>`;
                    } else {
                        statusBadge = `<span class="badge badge-blue">${progress}</span>`;
                    }
                    const statusCell = `<td>${statusBadge}</td>`;

                    // --- 3. CONFESSION DECISION ---
                    // It could be in 'choice_decision', 'log_negotiate', or 'log_changed_mind'
                    let confessionText = user.choice_decision || '-';
                    if(user.log_negotiate) confessionText += `<br><small>(${user.log_negotiate})</small>`;
                    if(user.log_changed_mind) confessionText += `<br><span class="badge badge-yellow">Changed Mind!</span>`;
                    
                    const confessionCell = `<td>${confessionText}</td>`;

                    // --- 4. HANGOUT / DATE ---
                    const hangoutCell = `<td>${user.log_hangout || '-'}</td>`;

                    // --- 5. FINAL MESSAGES (Combine all inputs) ---
                    let messages = [];
                    if(user.log_date_plan) messages.push(`<strong>Plan:</strong> ${user.log_date_plan}`);
                    if(user.log_final_words) messages.push(`<strong>Final Words:</strong> ${user.log_final_words}`);
                    if(user.log_apology_message) messages.push(`<strong>Apology Reply:</strong> ${user.log_apology_message}`);
                    if(user.log_secrets) messages.push(`<strong>Secret:</strong> ${user.log_secrets}`);
                    
                    let messageHtml = messages.length > 0 
                        ? `<div class="message-box">${messages.join('<br><br>')}</div>` 
                        : '<span style="color:#ccc">No text yet</span>';
                    
                    const messageCell = `<td>${messageHtml}</td>`;

                    // Combine Row
                    row.innerHTML = nameCell + statusCell + confessionCell + hangoutCell + messageCell;
                    tbody.appendChild(row);
                });
            } else {
                loading.style.display = "block";
                loading.innerText = "No responses recorded yet.";
            }
        });

        // Helper to format time nicely
        function formatTime(isoString) {
            if(!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleString(); // e.g., "10/25/2023, 10:30 AM"
        }

    </script>
</body>
</html>
