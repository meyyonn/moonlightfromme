<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Okay this is my secrets</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              pacifico: ['Pacifico', 'cursive'],
              quicksand: ['Quicksand', 'sans-serif'],
            },
            colors: {
              primary: '#ff4d6d',
              primaryHover: '#ff3355',
              inputBg: '#fff0f3',
            },
            animation: {
              'gradient-bg': 'gradientBG 15s ease infinite',
              'float-up': 'floatUp 10s infinite linear',
              'cursor-blink': 'blink 0.8s infinite',
            },
            keyframes: {
              gradientBG: {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' },
              },
              floatUp: {
                '0%': { transform: 'translateY(0) rotate(45deg)', opacity: '0' },
                '50%': { opacity: '0.6' },
                '100%': { transform: 'translateY(-120vh) rotate(45deg)', opacity: '0' },
              },
              blink: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden; /* Prevent scrollbars from floating hearts */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- FloatingHearts Component ---
      const FloatingHearts = () => {
        return (
          <React.Fragment>
            <div 
              className="fixed w-5 h-5 bg-white/40 rotate-45 rounded-[50%] animate-float-up pointer-events-none before:content-[''] before:absolute before:-top-1/2 before:left-0 before:w-5 before:h-5 before:bg-inherit before:rounded-full after:content-[''] after:absolute after:top-0 after:-left-1/2 after:w-5 after:h-5 after:bg-inherit after:rounded-full"
              style={{ left: '10%', animationDuration: '8s', bottom: '-10vh' }}
            />
            <div 
              className="fixed w-5 h-5 bg-white/40 rotate-45 rounded-[50%] animate-float-up pointer-events-none before:content-[''] before:absolute before:-top-1/2 before:left-0 before:w-5 before:h-5 before:bg-inherit before:rounded-full after:content-[''] after:absolute after:top-0 after:-left-1/2 after:w-5 after:h-5 after:bg-inherit after:rounded-full"
              style={{ left: '75%', animationDuration: '12s', bottom: '-10vh' }}
            />
            <div 
              className="fixed w-5 h-5 bg-white/40 rotate-45 rounded-[50%] animate-float-up pointer-events-none before:content-[''] before:absolute before:-top-1/2 before:left-0 before:w-5 before:h-5 before:bg-inherit before:rounded-full after:content-[''] after:absolute after:top-0 after:-left-1/2 after:w-5 after:h-5 after:bg-inherit after:rounded-full"
              style={{ left: '40%', animationDuration: '15s', bottom: '-10vh', animationDelay: '2s' }}
            />
          </React.Fragment>
        );
      };

      // --- Book Component ---

      const BookCSS = `
        :root {
          --pink-dark: #d94f5c;
          --pink-light: #ff758c;
          --btn-grad: linear-gradient(to right, #ff6b81, #ff4757);
          --book-w: 300px; 
          --book-h: 400px; 
        }

        /* Responsive Variables */
        @media (max-width: 899px) {
          :root { --book-w: 280px; --book-h: 380px; }
        }
        @media (max-width: 480px) {
          :root { --book-w: 250px; --book-h: 350px; }
        }
        @media (max-width: 380px) {
          :root { --book-w: 220px; --book-h: 310px; }
        }

        .glass-box {
          background: rgba(255, 255, 255, 0.9);
          backdrop-filter: blur(10px);
          padding: 30px 40px;
          border-radius: 30px;
          box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
          width: 340px;
          max-width: 90%;
          border: 2px solid rgba(255, 255, 255, 0.6);
          text-align: center;
          position: absolute;
          top: 50%; left: 50%;
          transform: translate(-50%, -50%);
          z-index: 20; 
          transition: all 1s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        .message { 
          font-size: 18px; color: #444; line-height: 1.6; 
          font-weight: 600; min-height: 24px;
          font-family: 'Quicksand', sans-serif;
        }
        
        .cursor {
          display: inline-block; width: 2px; height: 18px; 
          background-color: var(--pink-dark); margin-left: 2px;
          animation: blink 0.8s infinite; vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .btn-option {
          padding: 12px 40px; border: none; border-radius: 50px;
          background: var(--btn-grad); color: white;
          font-family: 'Quicksand', sans-serif; 
          font-size: 18px; font-weight: bold; cursor: pointer;
          box-shadow: 0 8px 15px rgba(255, 71, 87, 0.3);
          transition: transform 0.2s, opacity 0.5s; 
          opacity: 0; pointer-events: none; display: block; margin: 20px auto 0;
        }
        .btn-option:active { transform: scale(0.95); }
        .btn-option.show { opacity: 1; pointer-events: auto; }

        /* Book Styling */
        .book {
          position: absolute;
          width: var(--book-w); height: var(--book-h);
          top: 50%; left: 50%;
          transform-style: preserve-3d;
          /* Default hidden state */
          transform: translate(-50%, -50%) scale(0.5); 
          /* Smooth transition for centering, scaling, and lateral movement */
          transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 1s ease, left 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
          opacity: 0;
          z-index: 10;
          cursor: pointer;
          -webkit-tap-highlight-color: transparent;
          touch-action: none; 
          user-select: none; 
        }

        .book.revealed {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.9); /* Centered initially for Closed Front */
        }

        /* Unzoomed States - Corrections for visual centering */
        .book.revealed.open {
          /* Center the spine */
          transform: translate(0%, -50%) scale(0.9);
        }
        
        .book.revealed.closed-back {
          /* Center the stack (which is to the left of spine) by shifting spine right */
          transform: translate(50%, -50%) scale(0.9);
        }

        /* ZOOMED STATES */
        
        /* 1. Closed Front (Page 0) - Centered Stack */
        .book.zoomed {
          opacity: 1;
          z-index: 50;
          transform: translate(-50%, -50%) scale(1.35);
        }

        /* 2. Open Spread (Pages 1 to N-1) - Centered Spine */
        /* Formula: translate( (scale/2 - 0.5) * 100%, -50% ) */
        /* Scale 1.35 -> (0.675 - 0.5) = 17.5% */
        .book.zoomed.open {
          transform: translate(17.5%, -50%) scale(1.35);
        }

        /* 3. Closed Back (Page N) - Centered Stack */
        /* Formula: translate( (scale - 0.5) * 100%, -50% ) */
        /* Scale 1.35 -> (1.35 - 0.5) = 85% */
        .book.zoomed.closed-back {
          transform: translate(85%, -50%) scale(1.35);
        }

        .paper {
          position: absolute; width: 100%; height: 100%;
          top: 0; left: 0;
          transform-origin: left center;
          transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1); 
          transform-style: preserve-3d;
        }

        .front, .back {
          position: absolute; width: 100%; height: 100%;
          backface-visibility: hidden;
          display: flex; align-items: center; justify-content: center;
          padding: 25px; 
          background: #fffdfb; 
          border-radius: 5px 15px 15px 5px;
          box-shadow: inset 4px 0px 20px rgba(0,0,0,0.08);
          border: 1px solid #e0e0e0;
          flex-direction: column;
          overflow-y: auto; /* Allow scrolling text if it gets too long */
          overflow-x: hidden;
        }
        .back { transform: rotateY(180deg); border-radius: 15px 5px 5px 15px; }
        .paper.flipped { transform: rotateY(-180deg); }

        .cover-front { background: linear-gradient(135deg, var(--pink-light), var(--pink-dark)); color: white; border: none; }
        .cover-back { background: linear-gradient(225deg, var(--pink-light), var(--pink-dark)); color: white; border: none; }
        
        .book-h2 { font-family: 'Pacifico', cursive; font-size: 32px; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); text-align: center; }
        
        .book-p { 
          font-size: 15px; 
          color: #333; 
          line-height: 1.6; 
          text-align: justify; 
          margin-bottom: 12px;
          font-family: 'Quicksand', sans-serif;
        }

        #tap-hint {
          position: fixed; bottom: 30px; width: 100%; text-align: center;
          color: rgba(255,255,255,0.9); font-size: 16px; opacity: 0; transition: 0.5s;
          pointer-events: none; z-index: 2000; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
          letter-spacing: 1px;
          font-family: 'Quicksand', sans-serif;
        }

        /* Reveal State (Desktop) */
        @media (min-width: 900px) {
          /* 1. Message Box on the Left */
          .reveal .glass-box { 
            top: 50%;
            left: 25%;
            transform: translate(-50%, -50%); /* Centered on the 25% line */
          }

          /* 2. Book Starts on the Right (Even when hidden) */
          .book {
            left: 75%;
          }
          
          /* 3. Book Centered when Zoomed */
          .book.zoomed {
            left: 50%;
          }
        }

        /* Reveal State (Mobile) */
        @media (max-width: 899px) {
          .reveal .glass-box { 
            top: 5%; /* Moved up to make room for centered book */
            left: 50%;
            transform: translate(-50%, 0); 
            padding: 20px 25px;
          }
          .message { font-size: 16px; }

          /* Zoomed Mobile Defaults */
          .book.zoomed {
            transform: translate(-50%, -50%) scale(1.1);
          }
          
          /* Open Spread on Mobile: Scale 0.9 */
          /* Formula: (0.9/2 - 0.5) = -0.05 -> -5% */
          .book.zoomed.open {
            transform: translate(-5%, -50%) scale(0.9);
          }

          /* Closed Back Mobile: Scale 1.1 */
          /* Formula: (1.1 - 0.5) = 0.6 -> 60% */
          .book.zoomed.closed-back {
            transform: translate(60%, -50%) scale(1.1);
          }
          
          .front, .back { padding: 20px; }
          .book-h2 { font-size: 26px; }
          .book-p { font-size: 14px; line-height: 1.5; margin-bottom: 10px; }
        }

        @media (max-width: 380px) {
          .reveal .glass-box { top: 3%; padding: 15px; }
          .book-p { font-size: 13px; margin-bottom: 8px; }
          .front, .back { padding: 15px; }
          .book-h2 { font-size: 24px; }
          
          /* Extra shrink for small screens: Scale 0.75 */
          /* Formula: (0.75/2 - 0.5) = -0.125 -> -12.5% */
          .book.zoomed.open {
            transform: translate(-12.5%, -50%) scale(0.75);
          }
        }
      `;

      const Book = ({ onFinish }) => {
        const [text, setText] = useState("");
        const [showCursor, setShowCursor] = useState(true);
        const [isRevealed, setIsRevealed] = useState(false);
        const [isZoomed, setIsZoomed] = useState(false);
        const [currentPage, setCurrentPage] = useState(0);
        const [showDoneBtn, setShowDoneBtn] = useState(false);
        
        const touchStart = useRef({ x: 0, y: 0, time: 0 });

        const msg = "Alright, now I want to share my secrets. Check out the interactive book.";
        const indexRef = useRef(0);
        const totalPages = 6;

        useEffect(() => {
          const type = () => {
            if (indexRef.current < msg.length) {
              const char = msg.charAt(indexRef.current);
              setText(prev => prev + char);
              indexRef.current++;
              
              let speed = 50; 
              if (char === '.' || char === '?' || char === '!') speed = 400; 
              else if (char === ',') speed = 400; 

              setTimeout(type, speed);
            } else {
              setShowCursor(false);
              setTimeout(() => setIsRevealed(true), 800);
            }
          };
          
          const timeoutId = setTimeout(type, 800);
          return () => clearTimeout(timeoutId);
        }, []);

        const zoomIn = () => {
          setIsZoomed(true);
        };

        const zoomOut = () => {
          setIsZoomed(false);
          
          if (currentPage >= totalPages) {
            setShowDoneBtn(true);
            setText("You may go to the next message");
          }

          if (currentPage < totalPages) {
              setTimeout(() => {
                  setCurrentPage(0);
              }, 500);
          }
        };

        const flipNext = () => {
          if (currentPage < totalPages) {
            setCurrentPage(prev => prev + 1);
          } else {
            zoomOut();
          }
        };

        const flipPrev = () => {
          if (currentPage > 0) {
            setCurrentPage(prev => prev - 1);
          }
        };

        const handleTouchStart = (e) => {
          if (!isZoomed) return;
          const touch = e.touches[0];
          touchStart.current = { x: touch.clientX, y: touch.clientY, time: Date.now() };
        };

        const handleTouchEnd = (e) => {
          if (!isZoomed) return;

          const touch = e.changedTouches[0];
          const dx = touch.clientX - touchStart.current.x;
          const dy = touch.clientY - touchStart.current.y;
          const dt = Date.now() - touchStart.current.time;

          if (dt < 500 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            if (dx > 0) {
              flipPrev(); 
            } else {
              flipNext(); 
            }
          }
        };

        const handleBookClick = (e) => {
          e.stopPropagation();
          if (!isZoomed) {
            zoomIn();
          } else {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            
            const screenW = window.innerWidth;
            if (e.clientX < screenW / 2) {
              flipPrev();
            } else {
              flipNext();
            }
          }
        };

        useEffect(() => {
          const handleKeyDown = (e) => {
            if (!isZoomed) return;
            if (e.key === "ArrowRight") flipNext();
            if (e.key === "ArrowLeft") flipPrev();
            if (e.key === "Escape") zoomOut();
          };
          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, [isZoomed, currentPage]);

        useEffect(() => {
          const handleClickOutside = (e) => {
            const bookEl = document.getElementById('book');
            if (isZoomed && bookEl) {
                if (!bookEl.contains(e.target)) {
                  zoomOut();
                }
            }
          };
          document.addEventListener('click', handleClickOutside);
          return () => document.removeEventListener('click', handleClickOutside);
        }, [isZoomed, currentPage]);

        const getZIndex = (index) => {
          const isFlipped = index < currentPage;
          return isFlipped ? index + 1 : totalPages - index + 1;
        };

        const isBookOpen = currentPage > 0 && currentPage < totalPages;
        const isBookClosedBack = currentPage === totalPages;
        
        let bookStateClass = "";
        if (isBookClosedBack) bookStateClass = "closed-back";
        else if (isBookOpen) bookStateClass = "open";

        return (
          <div className={`w-full h-full relative ${isRevealed ? 'reveal' : ''}`}>
            <style>{BookCSS}</style>
            
            <div 
              className="glass-box" 
              style={{ 
                opacity: isZoomed ? 0 : 1, 
                pointerEvents: isZoomed ? 'none' : 'auto' 
              }}
            >
              <div className="message">
                <span>{text}</span>
                {showCursor && <span className="cursor"></span>}
              </div>
              <button 
                className={`btn-option ${showDoneBtn ? 'show' : ''}`} 
                onClick={onFinish}
              >
                Done
              </button>
            </div>

            <div 
              id="book" 
              className={`book ${isRevealed ? 'revealed' : ''} ${isZoomed ? 'zoomed' : ''} ${bookStateClass}`}
              onClick={handleBookClick}
              onTouchStart={handleTouchStart}
              onTouchEnd={handleTouchEnd}
            >
              <div className={`paper ${0 < currentPage ? 'flipped' : ''}`} style={{ zIndex: getZIndex(0) }}>
                <div className="front cover-front">
                  <h2 className="book-h2">My Secrets</h2>
                  <p className="book-p" style={{textAlign:'center', color:'white', marginTop:'20px', opacity:0.9}}>(Tap to Open)</p>
                  <p className="book-p" style={{textAlign:'center', color:'white', fontSize:'12px', opacity:0.7, marginTop:'10px'}}>Swipe to flip</p>
                </div>
                <div className="back">
                  <p className="book-p"><strong>I don’t really like being called ‘Azfar’.</strong> I’d much prefer ‘Mirul,’ or you can call me ‘Yon’ if you’d like. I actually like that one more.</p>
                  <p className="book-p">Some of my friends already call me that, so it feels more natural to me.</p>
                </div>
              </div>
              
              <div className={`paper ${1 < currentPage ? 'flipped' : ''}`} style={{ zIndex: getZIndex(1) }}>
                <div className="front">
                  <p className="book-p"><strong>I’m quite sensitive.</strong> Even small jokes can hurt me more than people realize. I try to handle it because I don’t want to seem weak.</p>
                  <p className="book-p">That’s why I tend to stay quiet when people tease me. I just want to be easy-going, someone people feel comfortable being around.</p>
                </div>
                <div className="back">
                  <p className="book-p"><strong>I’m a very nervous person.</strong> Whenever I’m about to do something that could bring change, I tend to overthink the possible consequences.</p>
                  <p className="book-p">For example, when I tried to learn how to ride a motorcycle, I kept feeling like I would get into an accident. Even after I learned how to ride, I still get nervous when I’m trying to take a turn.</p>
                </div>
              </div>

              <div className={`paper ${2 < currentPage ? 'flipped' : ''}`} style={{ zIndex: getZIndex(2) }}>
                <div className="front">
                  <p className="book-p"><strong>I’m an overthinker.</strong> I tend to overthink everything, and sometimes I can’t even sleep because of it. It’s something I struggle with, and I hate having it. I overthink almost everything, especially about you.</p>
                  <p className="book-p">For example, when I’m doing something, I always wonder whether you wouldn’t mind it or not. I even worry that you wouldn’t even care about it.</p>
                </div>
                <div className="back">
                  <p className="book-p"><strong>I don’t like sharing my problems.</strong> When I feel bad, I often keep it all to myself, not even telling my parents. I only want to appear happy, because if I complain, it feels like I’m weak.</p>
                  <p className="book-p">Even when I try to open up, I don’t know how to say it. Deep down, though, I really struggle with it.</p>
                </div>
              </div>

              <div className={`paper ${3 < currentPage ? 'flipped' : ''}`} style={{ zIndex: getZIndex(3) }}>
                <div className="front">
                  <p className="book-p"><strong>I tend to feel guilty easily.</strong>  When I do something wrong, like teasing a friend, I worry whether they’re truly okay with it.</p>
                  <p className="book-p">Sometimes I apologize right away, but if I forget, I feel awkward to ask for forgiveness later. Even if I do small mistakes, I keep thinking about them.</p>
                </div>
                <div className="back">
                  <p className="book-p"><strong>I’m actually a naive person.</strong> I can’t bear to see someone get hurt, it really makes me feel pity for them.</p>
                  <p className="book-p">Or when I see an old lady selling something but having no customers, I feel sorry for her. I then think that if I ever get rich someday and become a millionaire, I would help her with her sales.</p>
                </div>
              </div>

              <div className={`paper ${4 < currentPage ? 'flipped' : ''}`} style={{ zIndex: getZIndex(4) }}>
                <div className="front">
                  <p className="book-p"><strong>I get jealous easily.</strong> And yes… mostly when I see you having fun with another guy. But what can I do?</p>
                  <p className="book-p">You have your own life, and who am I to you? I’m not your man. I have no power to change that.</p>
                </div>
                <div className="back">
                  <p className="book-p">But that’s not the kind of jealousy I mean.</p>
                  <p className="book-p">I also feel jealous when I see someone my age, or younger, achieving more than me. Or when I see my friends having fun while I can’t join because of family stuff.</p>
                </div>
              </div>

              <div className={`paper ${5 < currentPage ? 'flipped' : ''}`} style={{ zIndex: getZIndex(5) }}>
                <div className="front">
                  <p className="book-p">For example, I see all my friends working part-time. Even you had one, and I want one too.</p>
                  <p className="book-p">But my mom won’t let me work until after Eid. It feels frustrating, but as a son, I have to obey her… otherwise, I’d be considered a disobedient child.</p>
                </div>
                <div className="back cover-back">
                  <span style={{fontSize: '50px'}}>❤️</span>
                </div>
              </div>
            </div>

            <div id="tap-hint" style={{ opacity: isZoomed ? 1 : 0 }}>Tap to flip</div>
          </div>
        );
      };

      // --- Main App Component ---
      const App = () => {
        // Function to handle navigation
        const handleNavigation = () => {
		localStorage.setItem('story_progress', 'Read Secrets (Vulnerability Phase)');
          window.location.href = 'whatyouthinkaboutme.html';
        };

        return (
          <div className="relative w-full h-screen bg-gradient-to-br from-[#ff9a9e] to-[#fad0c4] overflow-hidden flex items-center justify-center font-quicksand">
            <FloatingHearts />
            {/* When book is done, navigate to the next HTML page */}
            <Book onFinish={handleNavigation} />
          </div>
        );
      };

      // --- Render App ---
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script> <script src="firebase-config.js"></script>
</body>
</html>
