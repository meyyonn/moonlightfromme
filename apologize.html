<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would you forgive me?</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 85%;
            width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 10;
        }

        h2 { 
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .typing-container {
            color: #555; 
            margin-bottom: 25px; 
            font-weight: 600;
            min-height: 80px;
            line-height: 1.6;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 18px;
            background-color: #ff4d6d;
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Hidden initially, fades in after typing */
        #inputArea {
            opacity: 0;
            transition: opacity 1s ease-in;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        #canvasText { 
            width: 100%; 
            height: 150px; 
            padding: 15px; 
            border-radius: 15px; 
            /* Pink Border and Background */
            border: 2px solid #ff4d6d; 
            background: #fff0f3; 
            color: #444; 
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Focus effect */
        #canvasText:focus {
            background: white;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.3);
        }

        button { 
            padding: 12px 40px; 
            background: #ff4d6d;
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
            transition: 0.3s;
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
        }

        button:hover { 
            background: #ff3355;
            transform: translateY(-3px); 
        }

        .heart {
            position: absolute;
            width: 20px; height: 20px;
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(45deg);
            animation: floatUp 10s infinite linear;
            bottom: -10vh;
        }
        .heart::before, .heart::after {
            content: ''; position: absolute;
            width: 20px; height: 20px;
            background: inherit; border-radius: 50%;
        }
        .heart::before { top: -10px; left: 0; }
        .heart::after { top: 0; left: -10px; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(45deg); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="heart" style="left: 10%; animation-duration: 8s;"></div>
    <div class="heart" style="left: 75%; animation-duration: 12s;"></div>

    <div class="card">
        
        <div class="typing-container">
            <span id="typeText"></span><span id="cursor" class="cursor"></span>
        </div>

        <div id="inputArea">
            <textarea id="canvasText" placeholder="Would you forgive me?"></textarea>
            <button onclick="finishJourney()">Done</button>
        </div>
    </div>

    <script>
        // --- Logic ---
        const message = "Okay, now I want to apologize if I’ve ever annoyed you, when i'm following you, or for any other mistakes I’ve made.";
        let i = 0;

        function typeWriter() {
            if (i < message.length) {
                const char = message.charAt(i); // define char here
                document.getElementById("typeText").innerHTML += char;
                i++;
                
                let delay = 50; // default delay

                // Pause at punctuation
                if (char === "?" || char === "," || char === ".") {
                    delay = 400; 
                }
                
                setTimeout(typeWriter, delay); // Use the variable delay
            } else {
                // Hide cursor
                document.getElementById("cursor").style.display = "none";
                
                // Show input area
                const inputArea = document.getElementById("inputArea");
                inputArea.style.display = "flex";
                
                // Small delay for fade-in
                setTimeout(() => { inputArea.style.opacity = "1"; }, 50);
            }
        }

        function finishJourney() {
            const content = document.getElementById('canvasText').value;

            // 1. Validation
            if (content.trim() === "") {
                alert("Please write a short note first! 😊");
                return;
            }

            // 2. SAVE THE DATA
            // Store her specific response to the apology
            localStorage.setItem('user_apology_response', content);
            localStorage.setItem('story_progress', 'Apology Accepted/responded');

            // 3. Redirect to the Climax
            window.location.href = "question.html";
        }

        // Start typing shortly after loading
        setTimeout(typeWriter, 500);
    </script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>
</body>
</html>
