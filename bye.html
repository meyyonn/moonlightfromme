<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Byeee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    /* --- BACKGROUND --- */
body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* --- THE CARD --- */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      padding: 40px 30px;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      border: 1px solid rgba(255, 255, 255, 0.6);
      max-width: 85%;
      width: 350px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* 1. TITLE - YOUR CUSTOM STYLE */
    h2 {
      font-family: 'Pacifico', cursive;
      color: #ff4d6d;
      margin: 0 0 10px 0; /* adjusted margin to fit layout */
      font-size: 2.5rem; /* bumped to 2.5rem so it's not too small, change to 2rem if you prefer smaller */
      font-weight: 400; /* Pacifico doesn't need bold */
    }

    /* 2. FINISH BUTTON */
    .finish-btn {
      background: #ff4d6d;
      color: white;
      border: none;
      padding: 12px 60px;
      font-size: 1.1rem;
      border-radius: 50px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
      transition: transform 0.2s;
    }

    .finish-btn:hover {
      background: #e63950;
      transform: scale(1.05);
    }

    /* 3. HOLLOW TEXT PILL */
    .text-pill {
      border: 2px solid #999; 
      background: transparent; 
      border-radius: 50px;
      padding: 10px 20px;
      width: 90%;
      color: #555;
      font-size: 0.9rem;
      font-weight: 700;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    /* --- SOCIAL ROW --- */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    /* --- ICON BUTTONS --- */
    .icon-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      position: relative;
    }

    /* SVG Base Styles */
    .icon-btn svg {
      width: 30px;
      height: 30px;
      transition: fill 0.3s ease;
    }

    /* --- BRAND SPECIFIC STYLES --- */
    
    /* Instagram */
    .ig svg { fill: #E1306C; } /* Official Pink */
    .ig:hover {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      transform: translateY(-8px) scale(1.1);
      box-shadow: 0 15px 30px rgba(225, 48, 108, 0.4);
    }
    .ig:hover svg { fill: white; }

    /* TikTok */
    .tk svg { fill: #000000; } /* Official Black */
    .tk:hover {
      background: #000;
      transform: translateY(-8px) scale(1.1);
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }
    .tk:hover svg { fill: white; }

    /* Facebook */
    .fb svg { fill: #1877F2; } /* Official Blue */
    .fb:hover {
      background: #1877F2;
      transform: translateY(-8px) scale(1.1);
      box-shadow: 0 15px 30px rgba(24, 119, 242, 0.4);
    }
    .fb:hover svg { fill: white; }
	
	/* Floating Heart Decorations */
    .heart {
      position: absolute;
      width: 20px; height: 20px;
      background: rgba(255, 255, 255, 0.4);
      transform: rotate(45deg);
      animation: floatUp 10s infinite linear;
      bottom: -10vh;
    }
    .heart::before, .heart::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      background: inherit;
      border-radius: 50%;
    }
    .heart::before { top: -10px; left: 0; }
    .heart::after { top: 0; left: -10px; }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(45deg); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
    }
  </style>
</head>
