<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Where? When?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      padding: 40px 30px;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      max-width: 85%;
      width: 450px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      z-index: 10;
    }

    .message {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
      min-height: 50px;
      font-weight: 600;
    }

    /* --- INPUT AREA (Hidden initially) --- */
    .input-area {
      display: none; /* Hidden until typing ends */
      flex-direction: column;
      gap: 15px;
      animation: fadeInUp 1s forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .custom-textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #ff4d6d;
      border-radius: 20px;
      font-family: 'Quicksand', sans-serif;
      font-size: 16px;
      outline: none;
      background: #fff0f3;
      color: #444;
      resize: none; 
      height: 80px;
      box-sizing: border-box;
    }

    .custom-textarea:focus {
      background: white;
      box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
    }

    .send-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 50px;
      background: #ff4d6d;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: 'Quicksand', sans-serif;
    }

    .send-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
      background: #ff3355;
    }

    /* Floating Hearts */
    .heart {
      position: absolute;
      width: 20px; height: 20px;
      background: rgba(255, 255, 255, 0.5);
      transform: rotate(45deg);
      animation: floatUp 10s infinite linear;
      bottom: -10vh;
      z-index: 1;
    }
    .heart::before, .heart::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      background: inherit;
      border-radius: 50%;
    }
    .heart::before { top: -10px; left: 0; }
    .heart::after { top: 0; left: -10px; }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(45deg); opacity: 0; }
      100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
    }

  </style>
</head>
<body>

  <div class="heart" style="left: 10%; animation-duration: 7s;"></div>
  <div class="heart" style="left: 30%; animation-duration: 11s;"></div>
  <div class="heart" style="left: 70%; animation-duration: 9s;"></div>
  <div class="heart" style="left: 90%; animation-duration: 12s;"></div>

  <div class="container">
    
    <div class="message">
      <span id="text"></span><span id="cursor" style="border-right: 3px solid #ff4d6d; animation: blink 1s infinite;"></span>
    </div>

    <div class="input-area" id="inputArea">
      <textarea id="responseDetails" class="custom-textarea" placeholder="When are you free? Or any preferred place?"></textarea>
      <button class="send-btn" onclick="goNext()">Done</button>
    </div>
  </div>

<script>
  const textEl = document.getElementById("text");
  const inputArea = document.getElementById("inputArea");
  const cursor = document.getElementById("cursor");
  
  const message = "So... when and where? Can you set it up? I can’t decide it since I don’t know when you’re free.";
  let i = 0;
  let dotCount = 0;

  function typeMessage() {
     if (i < message.length) {
      const char = message.charAt(i);
      textEl.innerHTML += char;
      i++;
      let delay = 60; // Normal typing speed

      // Pause at question marks
      if (char === "?") delay = 400; 

      // Pause at commas
      if (char === ",") delay = 400; 

      // Pause at dots
      if (char === ".") {
          dotCount++;
          if (dotCount === 3 || dotCount === 4) { 
              delay = 400; 
          }
      }
      setTimeout(typeMessage, delay); // Loop to type next character
    } else {
      // Typing finished: Hide cursor, show input
      cursor.style.display = "none";
      inputArea.style.display = "flex";
    }
  }

  function goNext() {
    const detail = document.getElementById("responseDetails").value;
    
    // Check if they wrote something
    if (detail.trim() === "") {
      alert("Please write a short note first! 😊");
      return;
    }

    // Save their response
    localStorage.setItem("finalDate", detail);
    // Track that she successfully completed the date planning
    localStorage.setItem('story_progress', 'Date details submitted');

    // Go to next page
    window.location.href = "alright.html";
  }

  // Start typing after a short delay
  setTimeout(typeMessage, 800);

</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script> <script src="firebase-config.js"></script>
</body>
</html>
